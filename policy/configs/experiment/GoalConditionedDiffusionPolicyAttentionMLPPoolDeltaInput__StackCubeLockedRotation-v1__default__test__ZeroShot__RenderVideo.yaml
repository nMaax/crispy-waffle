# @package _global_
defaults:
  - GoalConditionedDiffusionPolicyAttentionMLPPoolDeltaInput__StackCubeLockedRotation-v1__default__test__ZeroShot

name: ${hydra:runtime.choices.experiment}

# Renders and saves rollout videos for all 4 evaluations (the in-distribution baseline plus the 3
# zero-shot envs). Each callback gets its own `video_dir` subpath: RecordEpisode's output path is
# only namespaced by `phase` ("test" for all 4 here), not by the callback's `name`, so a shared
# video_dir would have all 4 rollouts overwrite each other's recordings.
trainer:
  callbacks:
    rollout_evaluation:
      num_episodes: 9
      num_envs: 9
      video_dir: "${hydra:runtime.output_dir}/renderings/StackCubeLockedRotation-v1"
    rollout_evaluation_place_left:
      num_episodes: 9
      num_envs: 9
      video_dir: "${hydra:runtime.output_dir}/renderings/PlaceCubeLeftLockedRotation-v1"
    rollout_evaluation_place_right:
      num_episodes: 9
      num_envs: 9
      video_dir: "${hydra:runtime.output_dir}/renderings/PlaceCubeRightLockedRotation-v1"
    rollout_evaluation_stack_swapped:
      num_episodes: 9
      num_envs: 9
      video_dir: "${hydra:runtime.output_dir}/renderings/StackCubeSwappedLockedRotation-v1"
