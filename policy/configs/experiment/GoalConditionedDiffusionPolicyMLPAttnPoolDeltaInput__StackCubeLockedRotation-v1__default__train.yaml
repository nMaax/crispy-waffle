# @package _global_
defaults:
  - GoalConditionedDiffusionPolicyMLP__StackCubeLockedRotation-v1__default__train
  - override /algorithm: goal_conditioned_diffusion_policy_mlp_attn_pool

name: ${hydra:runtime.choices.experiment}

# Conditions on the per-timestep goal-state differences (g - s_1, ..., g - s_T) instead of the
# observation embeddings and the goal embedding as separate entries (s_1, ..., s_T, g).
# Differenced in input space: embed(g - s_t), i.e. before the MLP embedder, so the embedder only
# ever sees goal-relative features. An attention pooling head then collapses the per-token MLP
# embedder's time axis before FiLM (see goal_conditioned_diffusion_policy_mlp_attn_pool).
algorithm:
  encoder:
    relative_goal: true
