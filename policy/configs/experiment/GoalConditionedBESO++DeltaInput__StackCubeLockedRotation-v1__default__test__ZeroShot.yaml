# @package _global_
defaults:
  - GoalConditionedBESO++DeltaInput__StackCubeLockedRotation-v1__default__train
  - override /trainer/callbacks: zero_shot_stack_cube_locked_rotation

name: ${hydra:runtime.choices.experiment}
ckpt_path: ???

# Runs zero-shot rollout evaluation on all 3 generalization envs (locked-rotation variants) in a
# single test invocation, logging one wandb bar chart per metric (success_once_rate,
# success_at_end_rate) comparing the 3 envs. See `RolloutEvaluationCallback`'s `name` param and
# `policy/eval.py::_log_zero_shot_bar_charts`.
#
# BESO conditions on classifier-free-guidance style continuous-time diffusion, so the 3 extra
# zero-shot callbacks need the same `num_inference_steps` the base rollout gets from this
# experiment's train.yaml (num_inference_steps isn't part of the shared zero-shot bundle since it's
# BESO-specific, not shared with the other diffusion-scheduler algorithms).
trainer:
  callbacks:
    rollout_evaluation_place_left:
      num_inference_steps: 3
    rollout_evaluation_place_right:
      num_inference_steps: 3
    rollout_evaluation_stack_swapped:
      num_inference_steps: 3
