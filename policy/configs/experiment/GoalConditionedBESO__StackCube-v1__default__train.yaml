# @package _global_
defaults:
  - override /algorithm: beso_policy
  - override /datamodule: goal_conditioned_trajectory_datamodule
  - override /trainer: default

name: ${hydra:runtime.choices.experiment}

algorithm:
  act_horizon: 1
  goal_horizon: 1

datamodule:
  dataset_file: ${oc.env:HOME}/.maniskill/demos/StackCube-v1/motionplanning/trajectory.state_dict.pd_ee_delta_pos.physx_cuda.h5
  obs_horizon: 5
  pred_horizon: 5
  her_ratio: 1.0

trainer:
  callbacks:
    early_stopping: null
    rollout_evaluation:
      num_inference_steps: 3
