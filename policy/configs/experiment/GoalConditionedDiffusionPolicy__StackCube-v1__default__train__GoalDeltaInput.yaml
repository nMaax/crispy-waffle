# @package _global_
defaults:
  - GoalConditionedDiffusionPolicy__StackCube-v1__default__train

name: ${hydra:runtime.choices.experiment}

# Conditions on the per-timestep goal-state differences (g - s_1, ..., g - s_T) instead of the
# observation embeddings and the goal embedding as separate entries (s_1, ..., s_T, g).
# Differenced in input space: embed(g - s_t). The embedder here is the identity, which makes that
# numerically identical to goal_delta=embedding, so there is no GoalDeltaEmbed counterpart to this
# config: the mode ablation only bites for the MLP embedder.
algorithm:
  goal_delta: input
