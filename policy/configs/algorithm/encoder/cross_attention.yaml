_target_: policy.algorithms.networks.encoder.encoder.ConditioningEncoder
_recursive_: false
decoder_type: cross_attention

relative_goal: true
# Explicit default (not null): tokenization is never actually optional -- something must always
# turn a task tree into tokens, so this names the default strategy instead of hiding it behind a
# Python-side fallback. Note cross-attention actually requires tokens_per_step > 1 (see
# ConditioningEncoder._validate_config), so this default only works once overridden, e.g. via
# `override tokenizer@encoder.tokenizer: object`.
tokenizer:
  _target_: policy.algorithms.networks.encoder.tokenizers.state.StateTokenizer
embedder: null
pooling: null
proprio_dim: null
task_dim: null
