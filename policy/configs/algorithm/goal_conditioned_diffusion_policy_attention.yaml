defaults:
  - goal_conditioned_diffusion_policy
  - override embedder: self_attention

# Only supported mode: the attention embedder mixes across the r_t = g - s_t token window, which
# only exists in goal_delta="input" (goal_delta=None has no token window; goal_delta="embedding"
# differences after the embedder, so it never gives the embedder the token window to attend over).
goal_delta: input

embedder:
  obs_horizon: ${..obs_horizon}
