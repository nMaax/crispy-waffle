defaults:
  - beso_policy
  - override decoder: object_diffusion_gpt

_target_: policy.algorithms.beso_policy.BesoPolicy

# BESO++DeltaInput: folds the goal into a delta (g - s_t) instead of conditioning on a standalone
# goal token, and gives proprioception its own per-timestep token. CFG's "unconditional"
# goal-zeroing has no meaning once there's no standalone goal tensor to zero.
relative_goal: true
goal_drop_prob: 0.0
cfg_lambda: null
