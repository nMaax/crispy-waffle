defaults:
  - base_config
  - _self_
  - algorithm: null
  - optional datamodule: null
  - trainer: default.yaml
  - hydra: default.yaml

  # experiment configs allow for version control of specific hyperparameters
  # e.g. best hyperparameters for given model and datamodule
  - experiment: null

  - optional render: null

# This is a good default name to use when you aren't doing a sweep. Otherwise it causes an error.
# name: "${hydra:runtime.choices.algorithm}-${hydra:runtime.choices.decoder}-${hydra:runtime.choices.datamodule}"

# HF Hub model repo id to sync/resume checkpoints from. Set the HF_CHECKPOINT_REPO_ID env var to
# opt in; unset means fully local, no HF Hub calls.
hf_checkpoint_repo_id: ${oc.env:HF_CHECKPOINT_REPO_ID,null}
