rollout_evaluation:
  _target_: policy.algorithms.callbacks.rollout_evaluation.RolloutEvaluationCallback
  _recursive_: false
  num_episodes: 50 # default for training
  num_envs: null # =1: CPU backend, >1: GPU backend, null: auto, i.e., min(num_val_episodes, num_test_episodes)
  max_episode_steps: 250 # WARN: HIGHLY IMPORTANT!!!
  ignore_terminations: true # WARN: HIGHLY IMPORTANT!!!
  clamp_action: true
  video_dir: null
  seed: ${seed} # Seed is passed by config.py

  # Fetch everything from the dataset automatically
  env_id: null
  robot_uids: null
  obs_mode: null
  control_mode: null
  physx_backend: null
