_target_: policy.datamodules.trajectory_datamodule.TrajectoryDataModule
dataset_file: ${oc.env:HOME}/.maniskill/demos/StackCube-v1/motionplanning/trajectory.state.pd_ee_delta_pos.physx_cuda.h5
hf_dataset_repo: ${oc.env:HF_DATASET_REPO,null}

obs_horizon: 2
pred_horizon: 16

as_dict: true
canonicalize: true

obs_dim:
  proprio: 18
  tcp_pose: 7
  a_pose: 7
  b_pose: 7
  tcp_to_a: 3
  tcp_to_b: 3
  a_to_b: 3
act_dim: 4

batch_size: 256
load_count: 500
num_workers: 4

val_split: 0.1
lazy: false
seed: ${seed}
