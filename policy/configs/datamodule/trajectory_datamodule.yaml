_target_: policy.datamodules.trajectory_datamodule.TrajectoryDataModule
dataset_file: ${oc.env:HOME}/.maniskill/demos/StackCube-v1/motionplanning/trajectory.state_dict.pd_ee_delta_pos.physx_cuda.h5
hf_dataset_repo: ${oc.env:HF_DATASET_REPO,null}

obs_horizon: 2
pred_horizon: 16

canonicalize: true

# Pool slot 0 is the TCP, so a 2-object task has 3 slots.
obs_dim:
  proprio: 18
  obj_pose: [3, 7]
  obj_role: [3, 4]
  obj_valid: [3]
act_dim: 4

batch_size: 256
load_count: 500
num_workers: 4

val_split: 0.1
lazy: false
seed: ${seed}
