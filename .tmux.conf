# ==============================================================================
#  CHEATSHEET / HELPER
# ==============================================================================
#  SOURCE VIA: tmux -f .tmux.conf
#
#  PREFIX: Ctrl + a
#
#  PANE NAVIGATION (No Prefix):
#    Alt + h / j / k / l   -> Move Left / Down / Up / Right
#
#  PANE & WINDOW MANAGEMENT (Use Prefix):
#    Prefix + |            -> Split pane vertically (side-by-side)
#    Prefix + -            -> Split pane horizontally (top-bottom)
#    Prefix + c            -> New window
#    Prefix + z            -> Zoom / Unzoom active pane (Full screen toggle)
#    Prefix + r            -> Reload this config file
#    Prefix + ? or /       -> Display this keybinding cheatsheet
#
#  ML WORKFLOWS (Use Prefix):
#    Prefix + Alt + m      -> Launch 2-Pane ML Dashboard (Left: Shell | Right: nvitop)
# ==============================================================================

# ==============================================================================
#  1. ERGONOMICS & MOUSE CONTROL
# ==============================================================================
# Change prefix to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support (click panes, scroll back, drag to resize)
set -g mouse on

# Increase scrollback history
set -g history-limit 50000

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ==============================================================================
#  2. NAVIGATION & SPLITS
# ==============================================================================
# Vim-like pane switching
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Split panes visually with prefix + | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new window in current path
bind c new-window -c "#{pane_current_path}"

# Easy reload
bind r source-file "#{current_file}" \; display-message "Config reloaded from #{current_file}!"

# NOTE: wrapped in `bash -c '...'` because the popup is run via the user's
# login shell (fish here), which has no `<<EOF` heredoc syntax — without this
# fish fails instantly on the heredoc and -E immediately closes the popup.
bind ? display-popup -E -w 65 -h 16 -T " Tmux Cheatsheet (Press q or Esc to close) " "bash -c 'cat <<EOF | less -R
  PREFIX KEY: Ctrl + a

  PANE NAVIGATION (No Prefix Needed):
    Alt + h / j / k / l   -> Move Left / Down / Up / Right

  PANE & WINDOW MANAGEMENT (Use Prefix: Ctrl+a):
    Prefix + |            -> Split pane vertically (side-by-side)
    Prefix + -            -> Split pane horizontally (top-bottom)
    Prefix + c            -> New window
    Prefix + z            -> Zoom / Unzoom active pane (Full screen toggle)
    Prefix + r            -> Reload this config file

  ML WORKFLOWS (Use Prefix: Ctrl+a):
    Prefix + Alt + m      -> Launch ML Dashboard (Left: Shell | Right: nvitop)
EOF'"

bind / display-popup -E -w 65 -h 16 -T " Tmux Cheatsheet (Press q or Esc to close) " "bash -c 'cat <<EOF | less -R
  PREFIX KEY: Ctrl + a

  PANE NAVIGATION (No Prefix Needed):
    Alt + h / j / k / l   -> Move Left / Down / Up / Right

  PANE & WINDOW MANAGEMENT (Use Prefix: Ctrl+a):
    Prefix + |            -> Split pane vertically (side-by-side)
    Prefix + -            -> Split pane horizontally (top-bottom)
    Prefix + c            -> New window
    Prefix + z            -> Zoom / Unzoom active pane (Full screen toggle)
    Prefix + r            -> Reload this config file

  ML WORKFLOWS (Use Prefix: Ctrl+a):
    Prefix + Alt + m      -> Launch ML Dashboard (Left: Shell | Right: nvitop)
EOF'"

# ==============================================================================
#  3. ML WORKFLOW
# ==============================================================================
# ML Dashboard (2-Pane Split):
#   Left (50%):  Active terminal for training
#   Right (50%): nvitop GPU + CPU/RAM monitor via uvx
bind M-m split-window -h -c "#{pane_current_path}" "uvx nvitop" \; \
         select-pane -L

# ==============================================================================
#  4. VISUALS & STATUS BAR
# ==============================================================================
# 256-color support
set -g default-terminal "screen-256color"

# Active/Inactive pane border colors
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=cyan

# Status bar design
set -g status-position bottom
set -g status-style bg=colour235,fg=colour136
set -g status-left-length 30
set -g status-left "#[fg=green]#S #[fg=yellow]| "
set -g status-right "#[fg=cyan]%H:%M #[fg=white]%d-%b"

# Active window tab highlighting
setw -g window-status-current-style fg=black,bg=cyan,bold
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
